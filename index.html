<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario RSB Admin</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 10px; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 10px; margin: 10px auto; width: 90%; max-width: 400px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px;}
        button { background: #0056b3; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        
        .tabs { display: flex; gap: 5px; justify-content: center; margin-bottom: 15px; }
        .tabs button { margin: 0; background: #888; padding: 10px; font-size: 14px;}
        .tabs button.activo { background: #0056b3; }
        
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
        #btnDescargar { margin-top: 15px; background: #28a745; display: none; }
        .seccion { display: none; }
        .seccion.activa { display: block; }
        
        /* Estilos de Lista y Categorías */
        .btn-categoria { background: #17a2b8; padding: 15px; margin-bottom: 10px; font-size: 18px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center;}
        
        .item-lista { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; border-left: 5px solid #0056b3; position: relative;}
        .item-lista.alerta-stock { border-left: 5px solid #dc3545; background: #fff3f3; }
        .item-lista h4 { margin: 0 0 5px 0; color: #0056b3; font-size: 18px;}
        .item-lista p { margin: 3px 0; font-size: 14px; color: #444; }
        
        /* Controles de Stock Rápido */
        .control-stock { display: flex; align-items: center; gap: 10px; margin-top: 10px; background: #e9ecef; padding: 5px; border-radius: 5px; width: fit-content;}
        .control-stock button { background: #444; margin: 0; padding: 5px 15px; width: auto; font-size: 18px;}
        .control-stock span { font-size: 18px; font-weight: bold; min-width: 30px; text-align: center;}
        
        .foto-pieza { width: 100%; max-height: 200px; object-fit: contain; background: #eee; border-radius: 5px; margin-bottom: 10px; display: none; }
        #reader { width: 100%; margin-top: 15px; border-radius: 5px; overflow: hidden;}
        #resultadoEscaneo { margin-top: 15px; padding: 15px; background: #e2f0d9; border-left: 5px solid #28a745; border-radius: 5px; text-align: left; font-size: 16px; display: none; white-space: pre-wrap;}
        .file-input-wrapper { background: #e9ecef; padding: 10px; border-radius: 5px; margin: 8px 0; border: 1px dashed #ccc;}
        .file-input-wrapper input { padding: 0; border: none; background: transparent; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📦 RSB Admin</h2>
        
        <div class="tabs">
            <button id="btnNuevo" class="activo" onclick="cambiarTab('nuevo')">➕ Registro</button>
            <button id="btnLista" onclick="cambiarTab('lista')">🗂️ Categorías</button>
            <button id="btnEsc" onclick="cambiarTab('escanear')">📷 Escanear</button>
        </div>

        <!-- REGISTRAR -->
        <div id="secNuevo" class="seccion activa">
            <input type="text" id="hoja" list="hojasGuardadas" placeholder="Sección / Categoría (Ej. Eléctrico)">
            <datalist id="hojasGuardadas"></datalist>
            
            <input type="text" id="pieza" placeholder="Nombre de la Pieza">
            <input type="text" id="fab" placeholder="Fabricante">
            <input type="text" id="num" placeholder="No. de Parte (Único)">
            <input type="number" id="cant" placeholder="Cantidad Inicial en stock">
            
            <div class="file-input-wrapper">
                <label style="font-size: 14px; color: #555; display:block; margin-bottom:5px;"><strong>📸 Foto:</strong></label>
                <input type="file" id="fotoInput" accept="image/*" capture="environment">
                <img id="previewFoto" class="foto-pieza" style="margin-top: 10px;">
            </div>

            <button onclick="guardarYGenerar()">Guardar y Crear Etiqueta</button>
            <div id="qrcode"></div>
            <button id="btnDescargar" onclick="descargar()">Descargar Etiqueta</button>
        </div>

        <!-- LISTA Y CATEGORÍAS -->
        <div id="secLista" class="seccion">
            
            <!-- Vista de Carpetas -->
            <div id="vistaCarpetas">
                <h3 style="color:#555;">Apartados de Refacciones</h3>
                <div id="contenedorCarpetas"></div>
            </div>

            <!-- Vista de Items por Carpeta -->
            <div id="vistaItems" style="display:none;">
                <button onclick="volverCarpetas()" style="background:#6c757d; padding:10px; margin-bottom:15px;">⬅️ Volver a Categorías</button>
                <h3 id="tituloCarpeta" style="color:#0056b3; margin-top:0;"></h3>
                <input type="text" id="buscador" placeholder="🔍 Buscar pieza en esta categoría..." onkeyup="cargarItemsCarpeta()">
                <div id="contenedorLista" style="margin-top: 15px;"></div>
            </div>

        </div>

        <!-- ESCÁNER -->
        <div id="secEscanear" class="seccion">
            <div id="reader"></div>
            <div id="resultadoEscaneo"></div>
        </div>
    </div>

    <script>
        let escanerActivado = null;
        let inventario = JSON.parse(localStorage.getItem('inventarioRSB_V4')) || [];
        let fotoBase64 = "";
        let carpetaActual = ""; // Guarda la carpeta que estamos viendo

        // Manejo de la foto
        document.getElementById('fotoInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if(!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let scaleSize = 400 / img.width;
                    canvas.width = 400; canvas.height = img.height * scaleSize;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('previewFoto').src = fotoBase64;
                    document.getElementById('previewFoto').style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function actualizarDatalistHojas() {
            let hojasUnicas = [...new Set(inventario.map(i => i.hoja))];
            let datalist = document.getElementById('hojasGuardadas');
            datalist.innerHTML = "";
            hojasUnicas.forEach(h => {
                if(h) datalist.innerHTML += `<option value="${h}">`;
            });
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.seccion').forEach(el => el.classList.remove('activa'));
            document.querySelectorAll('.tabs button').forEach(el => el.classList.remove('activo'));
            
            if(tab === 'nuevo') { 
                document.getElementById('secNuevo').classList.add('activa'); 
                document.getElementById('btnNuevo').classList.add('activo'); 
                detenerEscaner(); 
                actualizarDatalistHojas(); 
            }
            if(tab === 'lista') { 
                document.getElementById('secLista').classList.add('activa'); 
                document.getElementById('btnLista').classList.add('activo'); 
                volverCarpetas(); 
                detenerEscaner(); 
            }
            if(tab === 'escanear') { 
                document.getElementById('secEscanear').classList.add('activa'); 
                document.getElementById('btnEsc').classList.add('activo'); 
                iniciarEscaner(); 
            }
        }

        // GUARDAR REGISTRO
        function guardarYGenerar() {
            let h = document.getElementById('hoja').value.trim() || "General";
            let p = document.getElementById('pieza').value.trim();
            let f = document.getElementById('fab').value.trim();
            let n = document.getElementById('num').value.trim();
            let c = parseInt(document.getElementById('cant').value);

            if(!p || !f || !n || isNaN(c)){ alert("Faltan datos o la cantidad no es válida."); return; }

            let indice = inventario.findIndex(item => item.numParte === n);
            let nuevaPieza = { hoja: h, pieza: p, fab: f, numParte: n, cantidad: c, foto: fotoBase64 };
            
            if(indice >= 0) {
                if(!fotoBase64) nuevaPieza.foto = inventario[indice].foto;
                inventario[indice] = nuevaPieza;
            } else {
                inventario.push(nuevaPieza);
            }
            
            localStorage.setItem('inventarioRSB_V4', JSON.stringify(inventario));

            let qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            let textoQR = `Sección: ${h}\nPieza: ${p}\nNo. Parte: ${n}\nFab: ${f}`;
            new QRCode(qrDiv, { text: textoQR, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
            document.getElementById('btnDescargar').style.display = 'block';
            
            alert("¡Guardado exitosamente!");
            fotoBase64 = ""; document.getElementById('previewFoto').style.display = 'none'; document.getElementById('fotoInput').value = "";
            actualizarDatalistHojas();
        }

        // NAVEGACIÓN DE CATEGORÍAS
        function volverCarpetas() {
            document.getElementById('vistaItems').style.display = 'none';
            document.getElementById('vistaCarpetas').style.display = 'block';
            document.getElementById('buscador').value = "";
            
            let hojasUnicas = [...new Set(inventario.map(i => i.hoja))];
            let divCarpetas = document.getElementById('contenedorCarpetas');
            divCarpetas.innerHTML = "";
            
            if(hojasUnicas.length === 0) {
                divCarpetas.innerHTML = "<p>Aún no hay categorías registradas.</p>";
                return;
            }

            hojasUnicas.forEach(hoja => {
                let itemsEnHoja = inventario.filter(i => i.hoja === hoja).length;
                divCarpetas.innerHTML += `
                    <button class="btn-categoria" onclick="abrirCarpeta('${hoja}')">
                        <span>📁 ${hoja}</span>
                        <span style="background:white; color:#17a2b8; padding:2px 8px; border-radius:10px; font-size:14px;">${itemsEnHoja} piezas</span>
                    </button>
                `;
            });
        }

        function abrirCarpeta(hoja) {
            carpetaActual = hoja;
            document.getElementById('vistaCarpetas').style.display = 'none';
            document.getElementById('vistaItems').style.display = 'block';
            document.getElementById('tituloCarpeta').innerText = `📁 Sección: ${hoja}`;
            cargarItemsCarpeta();
        }

        function cargarItemsCarpeta() {
            let divLista = document.getElementById('contenedorLista');
            divLista.innerHTML = "";
            let buscador = document.getElementById('buscador').value.toLowerCase();
            
            let filtrados = inventario.filter(item => {
                let coincideHoja = item.hoja === carpetaActual;
                let coincideTexto = item.pieza.toLowerCase().includes(buscador) || item.numParte.toLowerCase().includes(buscador);
                return coincideHoja && coincideTexto;
            });

            if(filtrados.length === 0) { divLista.innerHTML = "<p>No hay piezas que coincidan.</p>"; return; }

            filtrados.forEach(item => {
                let imgTag = item.foto ? `<img src="${item.foto}" class="foto-pieza" style="display:block;">` : '';
                
                // LÓGICA DE ALERTA DE STOCK (3 piezas o menos)
                let esStockBajo = item.cantidad <= 3;
                let claseAlerta = esStockBajo ? 'alerta-stock' : '';
                let mensajeAlerta = esStockBajo ? `<p style="color:#dc3545; font-weight:bold; font-size:16px;">⚠️ ¡STOCK BAJO!</p>` : '';

                divLista.innerHTML += `
                    <div class="item-lista ${claseAlerta}">
                        ${mensajeAlerta}
                        ${imgTag}
                        <h4>${item.pieza}</h4>
                        <p><strong>Fab:</strong> ${item.fab} | <strong>No. Parte:</strong> ${item.numParte}</p>
                        
                        <div class="control-stock">
                            <button onclick="editarStock('${item.numParte}', -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button onclick="editarStock('${item.numParte}', 1)">+</button>
                        </div>
                        
                        <button style="background:#dc3545; padding:5px; width:auto; font-size:12px; margin-top:10px;" onclick="borrarPieza('${item.numParte}')">🗑️ Eliminar Pieza</button>
                    </div>`;
            });
        }

        // EDICIÓN RÁPIDA DE STOCK
        function editarStock(numParte, cambio) {
            let indice = inventario.findIndex(item => item.numParte === numParte);
            if(indice >= 0) {
                let nuevaCantidad = inventario[indice].cantidad + cambio;
                if(nuevaCantidad < 0) nuevaCantidad = 0; // No permitir stock negativo
                
                inventario[indice].cantidad = nuevaCantidad;
                localStorage.setItem('inventarioRSB_V4', JSON.stringify(inventario));
                
                // Recargar la lista para mostrar el número y las alertas actualizadas
                cargarItemsCarpeta();
            }
        }

        function borrarPieza(n) {
            if(confirm("¿Seguro que quieres borrar esta pieza?")) { 
                inventario = inventario.filter(i => i.numParte !== n); 
                localStorage.setItem('inventarioRSB_V4', JSON.stringify(inventario)); 
                cargarItemsCarpeta(); 
            }
        }

        function descargar() {
            let canvas = document.querySelector('#qrcode canvas');
            let m = 20; let nC = document.createElement('canvas');
            nC.width = canvas.width + (m*2); nC.height = canvas.height + (m*2);
            let ctx = nC.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,nC.width,nC.height); ctx.drawImage(canvas,m,m);
            let link = document.createElement('a'); link.download = 'QR_RSB.png'; link.href = nC.toDataURL('image/png'); link.click();
        }

        // ESCÁNER
        function iniciarEscaner() {
            document.getElementById('resultadoEscaneo').style.display = 'none';
            if(escanerActivado) { escanerActivado.clear(); }
            escanerActivado = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            escanerActivado.render(onScanSuccess);
        }

        function detenerEscaner() { if(escanerActivado) { escanerActivado.clear(); escanerActivado = null; } }

        function onScanSuccess(textoQR) {
            detenerEscaner();
            let resDiv = document.getElementById('resultadoEscaneo');
            resDiv.style.display = 'block';
            
            if(textoQR.includes("No. Parte:")) {
                resDiv.style.borderLeftColor = "#28a745"; resDiv.style.backgroundColor = "#e2f0d9";
                resDiv.innerHTML = `<strong>✅ Pieza Leída:</strong><br><br>${textoQR}`;
            } else {
                resDiv.style.borderLeftColor = "#ffc107"; resDiv.style.backgroundColor = "#fff3cd";
                resDiv.innerHTML = `<strong>⚠️ QR Antiguo:</strong><br>${textoQR}`;
            }
        }
        
        actualizarDatalistHojas();
    </script>
</body>
</html>
