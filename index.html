<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario RSB</title>
    <link rel="manifest" href="manifest.json">
    <!-- Librería para Generar QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Librería para Escanear QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 10px; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 10px; margin: 10px auto; width: 90%; max-width: 350px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #0056b3; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        
        /* Estilos de las pestañas */
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .tabs button { margin: 0; background: #888; padding: 12px; }
        .tabs button.activo { background: #0056b3; }
        
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
        #btnDescargar { margin-top: 15px; background: #28a745; display: none; }
        
        /* Estilos del escáner */
        #seccionEscanear { display: none; }
        #reader { width: 100%; margin-top: 15px; border-radius: 5px; overflow: hidden;}
        #resultadoEscaneo { margin-top: 15px; padding: 15px; background: #e2f0d9; border-left: 5px solid #28a745; border-radius: 5px; text-align: left; white-space: pre-line; font-size: 16px; display: none;}
    </style>
</head>
<body>
    <div class="box">
        <h2>Inventario RSB</h2>
        
        <div class="tabs">
            <button id="btnGen" class="activo" onclick="cambiarTab('generar')">Generar QR</button>
            <button id="btnEsc" onclick="cambiarTab('escanear')">Escanear QR</button>
        </div>

        <!-- SECCIÓN GENERAR -->
        <div id="seccionGenerar">
            <input type="text" id="pieza" placeholder="Nombre de la Pieza">
            <input type="text" id="fabricante" placeholder="Fabricante">
            <input type="text" id="numParte" placeholder="No. de Parte">
            <button onclick="generar()">Generar QR</button>
            <div id="qrcode"></div>
            <button id="btnDescargar" onclick="descargar()">Descargar Imagen</button>
        </div>

        <!-- SECCIÓN ESCANEAR -->
        <div id="seccionEscanear">
            <p style="color:#555; font-weight:bold;">Apunta la cámara al código QR</p>
            <div id="reader"></div>
            <div id="resultadoEscaneo"></div>
        </div>
    </div>

    <script>
        let escanerActivado = null;

        function cambiarTab(tab) {
            document.getElementById('seccionGenerar').style.display = tab === 'generar' ? 'block' : 'none';
            document.getElementById('seccionEscanear').style.display = tab === 'escanear' ? 'block' : 'none';
            document.getElementById('btnGen').classList.toggle('activo', tab === 'generar');
            document.getElementById('btnEsc').classList.toggle('activo', tab === 'escanear');

            if(tab === 'escanear') {
                iniciarEscaner();
            } else {
                detenerEscaner();
            }
        }

        // --- CÓDIGO GENERADOR ---
        function generar() {
            let p = document.getElementById('pieza').value;
            let f = document.getElementById('fabricante').value;
            let n = document.getElementById('numParte').value;
            if(!p || !f || !n){ alert("Llena todos los campos."); return; }
            let qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            new QRCode(qrDiv, { text: `Pieza: ${p}\nFab: ${f}\nNo. Parte: ${n}`, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
            document.getElementById('btnDescargar').style.display = 'block';
        }

        function descargar() {
            let canvas = document.querySelector('#qrcode canvas');
            let m = 40;
            let nC = document.createElement('canvas');
            nC.width = canvas.width + (m * 2); nC.height = canvas.height + (m * 2);
            let ctx = nC.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, nC.width, nC.height);
            ctx.drawImage(canvas, m, m);
            let link = document.createElement('a');
            link.download = 'QR_RSB.png'; link.href = nC.toDataURL('image/png'); link.click();
        }

        // --- CÓDIGO ESCÁNER ---
        function iniciarEscaner() {
            document.getElementById('resultadoEscaneo').style.display = 'none';
            
            if(escanerActivado) { escanerActivado.clear(); }

            escanerActivado = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            escanerActivado.render(onScanSuccess);
        }

        function detenerEscaner() {
            if(escanerActivado) { 
                escanerActivado.clear(); 
                escanerActivado = null;
            }
        }

        function onScanSuccess(textoDecodificado) {
            let resDiv = document.getElementById('resultadoEscaneo');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "<strong>✅ Información de la pieza:</strong><br><br>" + textoDecodificado;
            detenerEscaner(); // Apaga la cámara al detectar
        }
    </script>
</body>
</html>
